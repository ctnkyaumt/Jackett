name: Sync Upstream and Release

on:
  schedule:
    - cron: '0 0 */5 * *' # Every 5 days
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a GitHub Release? (If false, saves as artifacts)'
        type: boolean
        default: true

jobs:
  sync-and-build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync with upstream Jackett and Bump Version
        run: |
          git remote add upstream https://github.com/Jackett/Jackett.git
          git fetch upstream

          # This fork replaced FlareSolverr with an embedded nodriver solver. A git merge cannot skip
          # individual upstream commits by topic, so instead we make sure upstream can never override
          # the fork's changes: merge preferring OURS on any conflict, then hard-restore the files that
          # are entirely fork-owned (nodriver solver, fork README, the workflows). This effectively
          # drops any upstream FlareSolverr-related changes to those files while still pulling in
          # everything else (indexer updates, fixes, etc.).
          # --no-commit so the restores below land in the merge commit itself: a push is rejected
          # outright if ANY of its commits touch .github/workflows, so the merge commit must be clean.
          $preMerge = git rev-parse HEAD
          git merge -X ours upstream/master --allow-unrelated-histories --no-ff --no-commit

          $forkOwned = @(
            "README.md",
            "nodriver",
            "src/Jackett.Common/Services/NodriverManagerService.cs"
          )
          git checkout $preMerge -- $forkOwned

          # GITHUB_TOKEN has no `workflow` scope (there is no such permission for it), so GitHub
          # rejects the push with "refusing to allow a GitHub App to create or update workflow ..."
          # if the merge changed anything under .github/workflows - which killed the entire sync.
          # Pin the whole directory to the fork's pre-merge state: -rf drops upstream's edits AND
          # any workflow file it added, then checkout restores ours.
          git rm -rf -q --ignore-unmatch .github/workflows
          git checkout $preMerge -- .github/workflows

          if (Test-Path .git/MERGE_HEAD) {
              git commit --no-edit -m "Auto-merge upstream Jackett"
          }

          # Version this fork as "upstream latest + 1": e.g. upstream v0.24.2184 -> this fork v0.24.2185.
          $latest = Invoke-RestMethod -Uri "https://api.github.com/repos/Jackett/Jackett/releases/latest" -Headers @{ "User-Agent" = "jackett-fork-ci" }
          $parts = $latest.tag_name.TrimStart('v').Split('.')
          $fullVersion = "$($parts[0]).$($parts[1]).$([int]$parts[2] + 1)"
          Set-Content -Path VERSION.txt -Value $fullVersion

          echo "FULL_VERSION=$fullVersion" >> $env:GITHUB_ENV

          git add VERSION.txt
          $status = git status --porcelain
          if (-not [string]::IsNullOrWhiteSpace($status)) {
              git commit -m "Set version to v$fullVersion"
              git push origin master
          } else {
              git push origin master
          }

      # NOTE REGARDING FLARESOLVERR:
      # Because the FlareSolverr logic was manually translated into native C# within Jackett, 
      # this workflow CANNOT automatically pull Python commits from the FlareSolverr repository 
      # and translate them into C#. If FlareSolverr updates its evasion logic, you will need 
      # to manually update NativeFlareSolverrClearanceHandler.cs in this repo.

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '9.0.x'

      - name: Build Jackett (win-x64)
        run: |
          dotnet publish src/Jackett.Server/Jackett.Server.csproj -c Release -f net9.0 -r win-x64 --self-contained true -p:Version=${{ env.FULL_VERSION }} -o ./pub/Server
          dotnet publish src/Jackett.Tray/Jackett.Tray.csproj -c Release -r win-x64 --self-contained true -p:Version=${{ env.FULL_VERSION }} -o ./pub/Tray
          dotnet publish src/Jackett.Service/Jackett.Service.csproj -c Release -r win-x64 --self-contained true -p:Version=${{ env.FULL_VERSION }} -o ./pub/Service
          dotnet publish src/Jackett.Updater/Jackett.Updater.csproj -c Release -f net9.0 -r win-x64 --self-contained true -p:Version=${{ env.FULL_VERSION }} -o ./pub/Updater

      # Mirror upstream's azure-pipelines.yml packaging: Server output is the base; Updater/Service
      # contribute only their own executables; Tray overwrites 3 Windows-specific DLLs and otherwise
      # only fills gaps. Publishing all projects into ONE folder (the old way) let Tray/Updater
      # clobber the server's ASP.NET Core 9 shared-framework DLLs with the 2.3.x netstandard
      # packages Jackett.Common references (Microsoft.AspNetCore.Http/WebUtilities) -> Jackett
      # crashed at startup with FileNotFoundException Microsoft.AspNetCore.Http 9.0.0.0 (v0.24.2252).
      - name: Merge publish outputs (Server wins conflicts)
        run: |
          New-Item -ItemType Directory publish-win | Out-Null
          Copy-Item ./pub/Server/* publish-win -Recurse
          Copy-Item ./pub/Updater/JackettUpdater* publish-win
          foreach ($dll in "System.Drawing.dll","System.Security.Cryptography.ProtectedData.dll","WindowsBase.dll") {
              if (Test-Path "./pub/Tray/$dll") { Copy-Item "./pub/Tray/$dll" publish-win -Force }
          }
          Get-ChildItem ./pub/Tray -File | Where-Object { -not (Test-Path (Join-Path publish-win $_.Name)) } | Copy-Item -Destination publish-win
          Copy-Item ./pub/Service/JackettService* publish-win

          # Guard against regression: the server's shared-framework DLLs must be 9.x, not the
          # 2.3.x netstandard package versions.
          foreach ($dll in "Microsoft.AspNetCore.Http.dll","Microsoft.AspNetCore.WebUtilities.dll") {
              $v = [System.Diagnostics.FileVersionInfo]::GetVersionInfo((Resolve-Path "publish-win/$dll")).ProductVersion
              if ($v -notmatch '^9\.') { throw "$dll is $v - expected 9.x. Packaging is broken." }
          }

      # Build the nodriver-based Cloudflare solver (embeddable Python + nodriver + aiohttp) and
      # ship it inside the Jackett binaries so it installs alongside Jackett.
      - name: Build nodriver solver bundle
        run: ./nodriver/build.ps1 -OutDir "publish-win/nodriver"

      - name: Package Jackett binaries
        run: |
          Rename-Item -Path "publish-win" -NewName "Jackett"
          Compress-Archive -Path "Jackett" -DestinationPath "Jackett.Binaries.Windows.zip"

      - name: Build Installer (Inno Setup)
        run: |
          iscc /DMyAppVersion="${{ env.FULL_VERSION }}" /DMySourceFolder="Jackett" /DMyOutputFilename="Jackett.Installer.Windows" Installer.iss

      - name: Upload Zip Artifact
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'false' }}
        uses: actions/upload-artifact@v4
        with:
          name: Jackett-Binaries-v${{ env.FULL_VERSION }}
          path: Jackett.Binaries.Windows.zip

      - name: Upload Installer Artifact
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'false' }}
        uses: actions/upload-artifact@v4
        with:
          name: Jackett-Installer-v${{ env.FULL_VERSION }}
          path: Output/Jackett.Installer.Windows.exe

      - name: Create Release
        if: ${{ github.event_name == 'schedule' || github.event.inputs.create_release != 'false' }}
        uses: softprops/action-gh-release@v1
        with:
          tag_name: "v${{ env.FULL_VERSION }}"
          files: |
            Jackett.Binaries.Windows.zip
            Output/Jackett.Installer.Windows.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
